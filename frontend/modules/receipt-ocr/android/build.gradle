plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.receiptocr'
version = '0.1.0'

android {
  namespace "expo.modules.receiptocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // modello latino dentro l'app: funziona senza rete e senza Google Play Services
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
